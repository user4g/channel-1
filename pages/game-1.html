<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>بازی حافظه | جفت‌یابی کارت‌ها</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #1e2b3c 0%, #0f1a24 100%);
            font-family: 'Segoe UI', 'Vazirmatn', system-ui, Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
            position: relative;
        }

        /* افکت داینامیک پس‌زمینه */
        .bg-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            background: radial-gradient(circle at 20% 40%, rgba(255,215,0,0.05) 0%, transparent 60%);
        }

        .game-container {
            position: relative;
            z-index: 10;
            max-width: 950px;
            width: 100%;
            background: rgba(15, 25, 35, 0.65);
            backdrop-filter: blur(12px);
            border-radius: 3rem;
            padding: 1.8rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.1);
            transition: all 0.2s;
        }

        /* هدر بازی */
        .game-header {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        h1 {
            font-size: 2rem;
            background: linear-gradient(135deg, #FFE6B0, #FFB347, #FF8C42);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            letter-spacing: -0.5px;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin: 1.2rem 0 0.8rem;
            flex-wrap: wrap;
        }

        .stat-card {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 2rem;
            padding: 0.5rem 1.5rem;
            display: flex;
            align-items: baseline;
            gap: 10px;
            color: #f1f5f9;
            font-weight: 600;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 215, 0, 0.3);
        }

        .stat-card i {
            font-size: 1.3rem;
            color: #facc15;
        }

        .stat-card span:first-of-type {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .stat-value {
            font-size: 1.7rem;
            font-weight: 800;
            color: #ffd966;
            line-height: 1;
        }

        /* شبکه کارت‌ها (گرید) */
        .memory-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.9rem;
            margin: 1.5rem 0;
            justify-items: center;
            align-items: center;
        }

        /* استایل کارت‌ها */
        .card {
            aspect-ratio: 4 / 3;
            width: 100%;
            max-width: 130px;
            background: linear-gradient(145deg, #ffd966, #f0b429);
            border-radius: 1.2rem;
            cursor: pointer;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.25s ease-in-out, box-shadow 0.2s;
            box-shadow: 0 12px 20px -8px rgba(0, 0, 0, 0.4);
        }

        .card.flipped, .card.matched {
            transform: rotateY(180deg);
            cursor: default;
        }

        .card.matched {
            filter: drop-shadow(0 0 8px #4ade80);
            opacity: 0.9;
            cursor: default;
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.7rem;
            font-weight: bold;
            box-sizing: border-box;
        }

        .card-front {
            background: linear-gradient(145deg, #facc15, #ffb347);
            transform: rotateY(180deg);
            color: #2d1f00;
            border: 2px solid #ffe6b3;
        }

        .card-back {
            background: repeating-linear-gradient(45deg, #2d3748, #2d3748 12px, #1e293b 12px, #1e293b 24px);
            transform: rotateY(0deg);
            border: 2px solid #facc15;
            font-size: 2rem;
            color: #ffd966;
        }

        .card-back::after {
            content: "?";
            opacity: 0.8;
            font-weight: bold;
        }

        /* دکمه‌ها */
        .button-group {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin: 1.2rem 0 0.5rem;
        }

        .btn-game {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            padding: 0.7rem 1.8rem;
            border-radius: 3rem;
            border: 1px solid #ffd966;
            color: #ffedb0;
            font-weight: bold;
            font-size: 1rem;
            font-family: inherit;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-game:hover {
            background: #ffb347;
            color: #1e2b2f;
            border-color: white;
            transform: scale(1.02);
            box-shadow: 0 5px 12px rgba(0,0,0,0.3);
        }

        .message-area {
            text-align: center;
            margin: 1rem 0;
            font-size: 1.1rem;
            font-weight: bold;
            color: #fff2cf;
            background: rgba(0, 0, 0, 0.4);
            padding: 0.6rem;
            border-radius: 3rem;
            transition: all 0.2s;
        }

        /* ریسپانسیو برای موبایل */
        @media (max-width: 580px) {
            .game-container {
                padding: 1rem;
            }
            .memory-grid {
                gap: 0.5rem;
            }
            .card-front, .card-back {
                font-size: 1.8rem;
            }
            .stat-value {
                font-size: 1.2rem;
            }
            .stat-card {
                padding: 0.3rem 1rem;
            }
            h1 {
                font-size: 1.5rem;
            }
        }

        @media (max-width: 480px) {
            .card-front, .card-back {
                font-size: 1.2rem;
            }
        }

        /* انیمیشن موفقیت */
        @keyframes winPulse {
            0% { transform: scale(1); text-shadow: 0 0 0 gold; }
            100% { transform: scale(1.02); text-shadow: 0 0 15px gold; }
        }
        .win-message {
            animation: winPulse 0.6s ease-in-out infinite alternate;
            color: #ffdf80;
        }
    </style>
    <!-- Font Awesome 6 (آیکون) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
<div class="bg-particles"></div>
<div class="game-container">
    <div class="game-header">
        <h1>
            <i class="fas fa-brain"></i> 
            بازی حافظه | جفت‌یاب 
            <i class="fas fa-puzzle-piece"></i>
        </h1>
        <div class="stats">
            <div class="stat-card">
                <i class="fas fa-chart-simple"></i>
                <span>تلاش‌ها:</span>
                <span class="stat-value" id="attemptsCount">0</span>
            </div>
            <div class="stat-card">
                <i class="fas fa-hourglass-half"></i>
                <span>جفت‌های پیدا شده:</span>
                <span class="stat-value" id="matchedPairs">0</span>
            </div>
        </div>
    </div>

    <!-- شبکه بازی (داینامیک) -->
    <div class="memory-grid" id="gameGrid"></div>

    <div class="button-group">
        <button class="btn-game" id="resetGameBtn"><i class="fas fa-arrows-rotate"></i> بازی مجدد</button>
        <button class="btn-game" id="newGameBtn"><i class="fas fa-play"></i> بازی جدید</button>
    </div>
    <div class="message-area" id="gameMessage">
        ✨ روی کارت‌ها کلیک کن، جفت‌ها را پیدا کن! ✨
    </div>
</div>

<script>
    (function() {
        // --- تم آیکون‌های شاد و رنگارنگ برای کارت‌ها ---
        const ICON_SET = [
            "🐶", "🐱", "🐭", "🐹",   // حیوانات
            "🐰", "🦊", "🐻", "🐼",
            "🐨", "🐯", "🦁", "🐮",
            "🐸", "🐵", "🐔", "🐧",
            "🐦", "🐴", "🦄", "🐌"
        ];
        
        // تعداد جفت‌ها = 8 جفت (16 کارت) => برای بازی استاندارد و نه خیلی سخت
        const PAIR_COUNT = 8;   // 16 کارت
        let gameCards = [];         // آرایه اشیاء کارت { id, icon, isFlipped, isMatched, element, cardId }
        let cardElements = new Map(); // نگاشت id به DOM element
        let openedCards = [];        // کارت‌های بازشده فعلی (حداکثر ۲)
        let lockBoard = false;       // قفل برد هنگام انیمیشن یا بررسی
        let attempts = 0;
        let matchedPairs = 0;
        
        // عناصر DOM
        const gridContainer = document.getElementById('gameGrid');
        const attemptsSpan = document.getElementById('attemptsCount');
        const matchedSpan = document.getElementById('matchedPairs');
        const gameMessageDiv = document.getElementById('gameMessage');
        const resetBtn = document.getElementById('resetGameBtn');
        const newGameBtn = document.getElementById('newGameBtn');
        
        // به‌روزرسانی آمار در UI
        function updateStatsUI() {
            attemptsSpan.innerText = attempts;
            matchedSpan.innerText = matchedPairs;
        }
        
        // نمایش پیام در نوار وضعیت
        function setMessage(msg, isWin = false) {
            gameMessageDiv.innerHTML = isWin ? `<i class="fas fa-trophy"></i> 🎉 ${msg} 🎉 <i class="fas fa-crown"></i>` : `✨ ${msg} ✨`;
            if(isWin) {
                gameMessageDiv.classList.add('win-message');
            } else {
                gameMessageDiv.classList.remove('win-message');
            }
        }
        
        // پایان بازی (برنده شدن)
        function checkWin() {
            if(matchedPairs === PAIR_COUNT) {
                setMessage(`تبریک! تو با ${attempts} تلاش همه جفت‌ها رو پیدا کردی! 🎉🎉`, true);
                // غیرفعال کردن کلیک روی کارت‌ها بعد از برد (بهتره قفل برد فعال باشه)
                lockBoard = true;
